<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow border-0 rounded-4 p-4">
          <h1 class="h3 text-center">SOFT-EFSRT</h1>
          
          <form novalidate>
            <label for="usuario" class="form-label">Usuario / Código</label>
            <input id="usuario" class="form-control mb-2" required>
            <div class="invalid-feedback">Ingrese usuario</div>

            <label for="clave" class="form-label">Contraseña</label>
            <input id="clave" type="password" class="form-control" required>
            <div class="invalid-feedback">Ingrese contraseña</div>

            <label for="rol" class="form-label mt-3">Rol</label>
            <select id="rol" class="form-select" required>
              <option value="">Seleccione</option>
              <option>Estudiante</option>
              <option>Docente Supervisor</option>
              <option>Supervisor de Empresa</option>
              <option>Coordinador</option>
              <option>Unidad Académica</option>
              <option>Administrador</option>
            </select>
            <div class="invalid-feedback">Seleccione rol</div>

            <button class="btn btn-success w-100 mt-4">Iniciar sesión</button>
          </form>

          <a href="index.html" class="mt-3">Volver</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.querySelector('form').addEventListener('submit', e => {
      e.preventDefault();
      e.target.classList.add('was-validated');
      
      if (e.target.checkValidity()) {
        alert('Formulario válido (práctica visual)');
      }
    });
  </script>

</body>
</html>
